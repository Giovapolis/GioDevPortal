services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: giodevportal:0.1.0
    container_name: giodevportal
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      DB_PATH: /app/data/app.db
      DATA_DIR: /app/data
    volumes:
      - giodevportal_data:/app/data
    restart: unless-stopped

volumes:
  giodevportal_data:
