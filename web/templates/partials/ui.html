{{define "metric-card"}}
<article class="circuit-card group overflow-hidden p-5">
  <span class="pointer-events-none absolute -right-8 -top-8 h-24 w-24 rounded-full bg-purple-500/10 blur-2xl"></span>
  <div class="relative flex items-start justify-between gap-4">
    <div>
      <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-purple-300/70">{{.label}}</p>
      <p class="mt-2 font-mono text-3xl font-semibold tabular-nums tracking-tight text-white">{{.value}}</p>
      {{if .hint}}<p class="mt-2 text-xs text-slate-400">{{.hint}}</p>{{end}}
    </div>
    <span class="mt-1 h-2 w-2 shrink-0 rounded-full {{.dot}} shadow-[0_0_12px_currentColor]"></span>
  </div>
  <div class="absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-transparent via-purple-400/30 to-transparent"></div>
</article>
{{end}}
