{{define "kanban_board"}}
<div id="kanban-board" data-project-id="{{.Project.ID}}" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
  {{range .TaskStatuses}}
    {{$status := .}}
    {{$tasks := index $.TasksByStatus $status}}
    <div class="rounded-xl bg-slate-200/70 p-3">
      <div class="flex items-center justify-between px-1 pb-2">
        <h3 class="text-sm font-semibold text-slate-700">{{taskStatus $status}}</h3>
        <span class="rounded-full bg-white px-2 py-0.5 text-xs text-slate-500">{{len $tasks}}</span>
      </div>
      <div data-kanban-column data-status="{{$status}}" class="min-h-[140px] space-y-2">
        {{range $tasks}}
        <div data-task-id="{{.ID}}" class="cursor-grab rounded-lg border border-slate-200 bg-white p-3 shadow-sm">
          <div class="flex items-start justify-between gap-2">
            <p class="text-sm font-medium text-slate-800">{{.Title}}</p>
            <form hx-post="/admin/projects/{{$.Project.ID}}/kanban/tasks/{{.ID}}/delete" hx-target="#kanban-board" hx-swap="outerHTML" onsubmit="return confirm('¿Eliminar esta tarea?')">
              <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
              <button type="submit" class="text-xs text-slate-400 hover:text-red-600" title="Eliminar">&#10005;</button>
            </form>
          </div>
          {{if .Description}}<p class="mt-1 text-xs text-slate-500 line-clamp-3">{{.Description}}</p>{{end}}
        </div>
        {{end}}
        {{if not $tasks}}<div class="rounded-lg border border-dashed border-slate-300 p-4 text-center text-xs text-slate-400">Sin tareas</div>{{end}}
      </div>
    </div>
  {{end}}
</div>
{{end}}
