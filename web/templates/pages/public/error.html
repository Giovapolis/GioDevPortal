{{define "content"}}
<div class="rounded-2xl bg-white p-10 text-center shadow-xl">
  <div class="text-6xl font-black text-slate-200">{{.Status}}</div>
  <h2 class="mt-3 text-xl font-semibold text-slate-900">{{.Title}}</h2>
  <p class="mt-2 text-sm text-slate-500">{{.Detail}}</p>
  <a href="/" class="mt-6 inline-block rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-700">Volver al inicio</a>
</div>
{{end}}
