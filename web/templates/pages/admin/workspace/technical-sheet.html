{{define "content"}}
<div class="space-y-6">
  <div class="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
    <strong>Ficha técnica privada.</strong> Esta información solo es visible para administradores y nunca se muestra en el portal del cliente.
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-lg font-semibold text-slate-900">Datos del proyecto</h2>
    <form method="post" action="/admin/projects/{{.Project.ID}}/technical-sheet" class="mt-5 grid grid-cols-1 gap-5 md:grid-cols-2">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Nombre</label>
        <input name="name" value="{{.Project.Name}}" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Estado</label>
        <select name="status" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="active" {{if eq .Project.Status "active"}}selected{{end}}>Activo</option>
          <option value="paused" {{if eq .Project.Status "paused"}}selected{{end}}>En pausa</option>
          <option value="completed" {{if eq .Project.Status "completed"}}selected{{end}}>Completado</option>
          <option value="archived" {{if eq .Project.Status "archived"}}selected{{end}}>Archivado</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-slate-700">Descripción</label>
        <textarea name="description" rows="2" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">{{.Project.Description}}</textarea>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Fecha de inicio</label>
        <input type="date" name="start_date" value="{{if .Project.StartDate.Valid}}{{dateInput .Project.StartDate.String}}{{end}}" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Costo base (MXN)</label>
          <input type="number" step="0.01" name="base_cost" value="{{float .Project.BaseCost}}" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Moneda</label>
          <div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-600">MXN · Peso mexicano</div>
        </div>
      </div>

      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-slate-700">Repositorio Git</label>
        <input name="git_repo" value="{{.Project.GitRepo}}" placeholder="git@github.com:org/repo.git" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono text-xs">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Acceso a servidores</label>
        <textarea name="server_access" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono text-xs" placeholder="ssh user@host, credenciales, puertos...">{{.Project.ServerAccess}}</textarea>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Llaves API</label>
        <textarea name="api_keys" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono text-xs" placeholder="SERVICE_KEY=...">{{.Project.ApiKeys}}</textarea>
      </div>
      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-slate-700">Notas privadas</label>
        <textarea name="private_notes" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">{{.Project.PrivateNotes}}</textarea>
      </div>
      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-slate-700">URL de staging</label>
        <input name="staging_url" value="{{.Project.StagingUrl}}" placeholder="https://staging..." class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>

      <div class="md:col-span-2 flex justify-end">
        <button class="rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-700">Guardar ficha técnica</button>
      </div>
    </form>
  </div>
</div>
{{end}}
