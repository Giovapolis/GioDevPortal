{{define "content"}}
<div class="glass-panel overflow-hidden p-8">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="font-mono text-[10px] uppercase tracking-[0.24em] text-fuchsia-300/70">Nuevo cifrado</p>
      <h2 class="mt-1 text-xl font-semibold text-white">Nueva contraseña</h2>
      <p class="mt-1 text-sm text-slate-400">Define una contraseña nueva para tu cuenta.</p>
    </div>
    <span class="mt-1 h-2 w-2 animate-pulse rounded-full bg-fuchsia-400 shadow-[0_0_10px_#e879f9]"></span>
  </div>
  <form method="post" action="/reset-password" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <input type="hidden" name="token" value="{{.Token}}">
    <div>
      <label class="field-label" for="reset-password">Contraseña</label>
      <input id="reset-password" type="password" name="password" required minlength="8" class="field-input">
    </div>
    <div>
      <label class="field-label" for="reset-confirm">Confirmar contraseña</label>
      <input id="reset-confirm" type="password" name="confirm" required minlength="8" class="field-input">
    </div>
    <button class="neon-button w-full py-2.5">Guardar contraseña</button>
  </form>
</div>
{{end}}
