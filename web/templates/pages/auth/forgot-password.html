{{define "content"}}
<div class="glass-panel overflow-hidden p-8">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="font-mono text-[10px] uppercase tracking-[0.24em] text-fuchsia-300/70">Protocolo de acceso</p>
      <h2 class="mt-1 text-xl font-semibold text-white">Recuperar contraseña</h2>
      <p class="mt-1 text-sm text-slate-400">Te enviaremos un enlace para restablecer tu contraseña.</p>
    </div>
    <span class="mt-1 h-2 w-2 animate-pulse rounded-full bg-fuchsia-400 shadow-[0_0_10px_#e879f9]"></span>
  </div>
  <form method="post" action="/forgot-password" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <div>
      <label class="field-label" for="forgot-email">Correo</label>
      <input id="forgot-email" type="email" name="email" required class="field-input">
    </div>
    <button class="neon-button w-full py-2.5">Enviar enlace</button>
  </form>
  <div class="mt-4 text-center text-sm">
    <a href="/login" class="text-fuchsia-300 transition-colors hover:text-fuchsia-200">Volver al inicio de sesión</a>
  </div>
</div>
{{end}}
