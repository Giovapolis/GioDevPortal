{{define "content"}}
<div class="mx-auto max-w-lg">
  <div class="glass-panel overflow-hidden p-8">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="font-mono text-[10px] uppercase tracking-[0.24em] text-fuchsia-300/70">Seguridad del nodo</p>
        <h2 class="mt-1 text-xl font-semibold text-white">Cambiar contraseña</h2>
        <p class="mt-1 text-sm text-slate-400">Por seguridad, actualiza tu contraseña temporal.</p>
      </div>
      <span class="mt-1 h-2 w-2 animate-pulse rounded-full bg-fuchsia-400 shadow-[0_0_10px_#e879f9]"></span>
    </div>
    <form method="post" action="/change-password" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <div>
        <label class="field-label" for="current-password">Contraseña actual</label>
        <input id="current-password" type="password" name="current_password" required class="field-input">
      </div>
      <div>
        <label class="field-label" for="new-password">Nueva contraseña</label>
        <input id="new-password" type="password" name="password" required minlength="8" class="field-input">
      </div>
      <div>
        <label class="field-label" for="confirm-password">Confirmar nueva contraseña</label>
        <input id="confirm-password" type="password" name="confirm" required minlength="8" class="field-input">
      </div>
      <button class="neon-button w-full py-2.5">Actualizar contraseña</button>
    </form>
  </div>
</div>
{{end}}
